<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login and Sign up form</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="bg circle bg1"></div>
    <div class="bg circle bg2"></div>
    <div class="bg circle bg3"></div>
    <div class="auth-wrapper"></div>
    <div class="auth-card" id="authCard"></div>
    <!-- login Form -->
    <div class="form-panel login-panel">
      <div class="logo">
        <i class="fa-solid fa-lock"></i>
        <h1>Welcome</h1>
        <p class="subtitle">Login to continue your journey</p>

        <form class="input-group">
          <!--Email-->
          <div class="input-group">
            <div class="electric-glow"></div>
            <div class="electric-border"></div>
            <input
              type="email"
              id="loginEmail"
              placeholder=" "
              autocomplete="email"
              required
            />
            <label for="loginEmail">Email Address</label>
          </div>
          <!--Password-->
          <div class="input-group">
            <div class="electric-glow"></div>
            <div class="electric-border"></div>
            <input
              type="password"
              id="loginPassword"
              placeholder=" "
              autocomplete="current-password"
              required
            />
            <label for="loginPassword">Password</label>
            <button type="button" class="password-toggle">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="options">
            <label class="checkbox">
              <input type="checkbox" /> Remember me
            </label>
            <a href="#">Forgot Password?</a>
          </div>
          <button type="submit" class="main-btn">Login</button>
        </form>
        <div class="switch-area">
          <span>Don't have an account?</span>
          <button type="button" class="switch-circle">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
        <div class="socials">
          <button type="button">G</button>
          <button type="button">f</button>
          <button type="button">in</button>
        </div>
        <!--Sign up-->
        <div class="form-panel signup-pael">
          <div class="logo">
            <i class="fa-solid fa-user"></i>
          </div>
          <h1>Create account</h1>
          <p class="subtitle">Start your journey with us</p>
          <form class="input-group">
            <!--Name-->
            <div class="input-group">
              <div class="electric-glow"></div>
              <div class="electric-border"></div>
              <input
                type="email"
                id="signupEmail"
                placeholder=" "
                autocomplete="email"
                required
              />
              <label for="signupEmail">Email Address</label>
            </div>
            <!--Password-->
            <div class="input-group">
              <div class="electric-glow"></div>
              <div class="electric-border"></div>
              <input
                type="password"
                id="signupPassword"
                placeholder=" "
                autocomplete="new-password"
                required
              />
              <label for="signupPassword">Password</label>
              <button type="button" class="password-toggle">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <!--confirm-->
            <div class="input-group">
              <div class="electric-glow"></div>
              <div class="electric-border"></div>
              <input
                type="password"
                id="confirmPassword"
                placeholder=" "
                autocomplete="new-password"
                required
              />
              <label for="confirmPassword">Confirm password</label>
            </div>
            <button type="button" class="main-btn">Create account</button>
          </form>
          <div class="switch-area">
            <span>Already have an account? Sign in</span>
            <button type="button" class="switch-circle">
              <i class="fa-solid fa-arrow-left"></i>
            </button>
          </div>
          <div class="socials">
            <button type="button">G</button>
            <button type="button">f</button>
            <button type="button">in</button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
